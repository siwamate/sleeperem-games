<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
      <linearGradient id="grad-bg-8_norwegian" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <filter id="glow-8_norwegian" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
    </defs>
    <rect width="200" height="200" rx="20" fill="url(#grad-bg-8_norwegian)"/>

    <g filter="url(#glow-8_norwegian)">
      <!-- Left Ear Facets -->
      <polygon points="50,75 18.8,24.6 80,55" fill="#78716c"/>
      <polygon points="50,75 18.8,24.6 65,42" fill="#a8a29e"/>
      <polygon points="65,42 18.8,24.6 80,55" fill="#d6d3d1"/>
      <polygon points="58,68 32.8,38.4 74,56" fill="#f472b6" opacity="0.75"/>

      <!-- Right Ear Facets -->
      <polygon points="150,75 181.2,24.6 120,55" fill="#78716c"/>
      <polygon points="150,75 181.2,24.6 135,42" fill="#a8a29e"/>
      <polygon points="135,42 181.2,24.6 120,55" fill="#d6d3d1"/>
      <polygon points="142,68 167.2,38.4 126,56" fill="#f472b6" opacity="0.75"/>

      <!-- Faceted Geodesic Sphere Body -->
      <!-- Center top -->
      <polygon points="100,55 75,70 100,85" fill="#d6d3d1"/>
      <polygon points="100,55 125,70 100,85" fill="#a8a29e"/>
      <!-- Top left & right -->
      <polygon points="75,70 50,75 60,105" fill="#78716c"/>
      <polygon points="75,70 60,105 100,85" fill="#a8a29e"/>
      <polygon points="125,70 150,75 140,105" fill="#78716c"/>
      <polygon points="125,70 140,105 100,85" fill="#d6d3d1"/>
      
      <!-- Mid Facets (Face zone) -->
      <polygon points="60,105 45,120 70,140" fill="#44403c"/>
      <polygon points="60,105 100,85 100,125" fill="#d6d3d1"/>
      <polygon points="60,105 70,140 100,125" fill="#a8a29e"/>
      
      <polygon points="140,105 155,120 130,140" fill="#44403c"/>
      <polygon points="140,105 100,85 100,125" fill="#a8a29e"/>
      <polygon points="140,105 130,140 100,125" fill="#78716c"/>
      
      <!-- Bottom Facets -->
      <polygon points="70,140 45,120 65,155" fill="#78716c"/>
      <polygon points="70,140 65,155 100,165" fill="#44403c"/>
      <polygon points="70,140 100,125 100,165" fill="#78716c"/>

      <polygon points="130,140 155,120 135,155" fill="#44403c"/>
      <polygon points="130,140 135,155 100,165" fill="#78716c"/>
      <polygon points="130,140 100,125 100,165" fill="#44403c"/>

      <!-- Bottom Cap -->
      <polygon points="65,155 100,165 100,175" fill="#44403c"/>
      <polygon points="135,155 100,165 100,175" fill="#1e293b"/>

      <!-- Special Breed Patterns -->
      
      

      <!-- Stylized Sleepy Geometric Eyes -->
      <path d="M 72 105 L 82 113 L 92 105" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="82" cy="109" r="1.8" fill="#10b981"/>
      
      <path d="M 108 105 L 118 113 L 128 105" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="118" cy="109" r="1.8" fill="#10b981"/>

      <!-- Low-Poly Nose & Mouth -->
      <polygon points="96,122 104,122 100,128" fill="#f43f5e"/>
      <path d="M 94 132 Q 100 136 100 128 Q 100 136 106 132" stroke="#44403c" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Geometric Whiskers -->
      <line x1="62" y1="120" x2="40" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="62" y1="126" x2="38" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="120" x2="160" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="126" x2="162" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </svg>