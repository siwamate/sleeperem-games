<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
      <linearGradient id="grad-bg-20_siamese" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <filter id="glow-20_siamese" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
    </defs>
    <rect width="200" height="200" rx="20" fill="url(#grad-bg-20_siamese)"/>

    <g filter="url(#glow-20_siamese)">
      <!-- Left Ear Facets -->
      <polygon points="50,75 18.8,24.6 80,55" fill="#cbd5e1"/>
      <polygon points="50,75 18.8,24.6 65,42" fill="#f1f5f9"/>
      <polygon points="65,42 18.8,24.6 80,55" fill="#ffffff"/>
      <polygon points="58,68 32.8,38.4 74,56" fill="#f472b6" opacity="0.75"/>

      <!-- Right Ear Facets -->
      <polygon points="150,75 181.2,24.6 120,55" fill="#cbd5e1"/>
      <polygon points="150,75 181.2,24.6 135,42" fill="#f1f5f9"/>
      <polygon points="135,42 181.2,24.6 120,55" fill="#ffffff"/>
      <polygon points="142,68 167.2,38.4 126,56" fill="#f472b6" opacity="0.75"/>

      <!-- Faceted Geodesic Sphere Body -->
      <!-- Center top -->
      <polygon points="100,55 75,70 100,85" fill="#ffffff"/>
      <polygon points="100,55 125,70 100,85" fill="#f1f5f9"/>
      <!-- Top left & right -->
      <polygon points="75,70 50,75 60,105" fill="#cbd5e1"/>
      <polygon points="75,70 60,105 100,85" fill="#f1f5f9"/>
      <polygon points="125,70 150,75 140,105" fill="#cbd5e1"/>
      <polygon points="125,70 140,105 100,85" fill="#ffffff"/>
      
      <!-- Mid Facets (Face zone) -->
      <polygon points="60,105 45,120 70,140" fill="#334155"/>
      <polygon points="60,105 100,85 100,125" fill="#ffffff"/>
      <polygon points="60,105 70,140 100,125" fill="#f1f5f9"/>
      
      <polygon points="140,105 155,120 130,140" fill="#334155"/>
      <polygon points="140,105 100,85 100,125" fill="#f1f5f9"/>
      <polygon points="140,105 130,140 100,125" fill="#cbd5e1"/>
      
      <!-- Bottom Facets -->
      <polygon points="70,140 45,120 65,155" fill="#cbd5e1"/>
      <polygon points="70,140 65,155 100,165" fill="#334155"/>
      <polygon points="70,140 100,125 100,165" fill="#cbd5e1"/>

      <polygon points="130,140 155,120 135,155" fill="#334155"/>
      <polygon points="130,140 135,155 100,165" fill="#cbd5e1"/>
      <polygon points="130,140 100,125 100,165" fill="#334155"/>

      <!-- Bottom Cap -->
      <polygon points="65,155 100,165 100,175" fill="#334155"/>
      <polygon points="135,155 100,165 100,175" fill="#1e293b"/>

      <!-- Special Breed Patterns -->
      
        <!-- Siamese Mask Points -->
        <polygon points="85,95 115,95 100,135" fill="#334155" opacity="0.85"/>
      
      

      <!-- Stylized Sleepy Geometric Eyes -->
      <path d="M 72 105 L 82 113 L 92 105" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="82" cy="109" r="1.8" fill="#0284c7"/>
      
      <path d="M 108 105 L 118 113 L 128 105" stroke="#0284c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="118" cy="109" r="1.8" fill="#0284c7"/>

      <!-- Low-Poly Nose & Mouth -->
      <polygon points="96,122 104,122 100,128" fill="#f43f5e"/>
      <path d="M 94 132 Q 100 136 100 128 Q 100 136 106 132" stroke="#334155" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Geometric Whiskers -->
      <line x1="62" y1="120" x2="40" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="62" y1="126" x2="38" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="120" x2="160" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="126" x2="162" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </svg>