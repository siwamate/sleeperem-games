      <polygon points="125,70 150,75 140,105" fill="#451a03"/>
      <polygon points="125,70 140,105 100,85" fill="#b45309"/>
      
      <!-- Mid Facets (Face zone) -->
      <polygon points="60,105 45,120 70,140" fill="#270e02"/>
      <polygon points="60,105 100,85 100,125" fill="#b45309"/>
      <polygon points="60,105 70,140 100,125" fill="#78350f"/>
      
      <polygon points="140,105 155,120 130,140" fill="#270e02"/>
      <polygon points="140,105 100,85 100,125" fill="#78350f"/>
      <polygon points="140,105 130,140 100,125" fill="#451a03"/>
      
      <!-- Bottom Facets -->
      <polygon points="70,140 45,120 65,155" fill="#451a03"/>
      <polygon points="70,140 65,155 100,165" fill="#270e02"/>
      <polygon points="70,140 100,125 100,165" fill="#451a03"/>

      <polygon points="130,140 155,120 135,155" fill="#270e02"/>
      <polygon points="130,140 135,155 100,165" fill="#451a03"/>
      <polygon points="130,140 100,125 100,165" fill="#270e02"/>

      <!-- Bottom Cap -->
      <polygon points="65,155 100,165 100,175" fill="#270e02"/>
      <polygon points="135,155 100,165 100,175" fill="#1e293b"/>

      <!-- Special Breed Patterns -->
      
      

      <!-- Stylized Sleepy Geometric Eyes -->
      <path d="M 72 105 L 82 113 L 92 105" stroke="#eab308" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="82" cy="109" r="1.8" fill="#eab308"/>
      
      <path d="M 108 105 L 118 113 L 128 105" stroke="#eab308" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="118" cy="109" r="1.8" fill="#eab308"/>

      <!-- Low-Poly Nose & Mouth -->
      <polygon points="96,122 104,122 100,128" fill="#f43f5e"/>
      <path d="M 94 132 Q 100 136 100 128 Q 100 136 106 132" stroke="#270e02" stroke-width="1.8" fill="none" stroke-linecap="round"/>

      <!-- Geometric Whiskers -->
      <line x1="62" y1="120" x2="40" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="62" y1="126" x2="38" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="120" x2="160" y2="115" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="138" y1="126" x2="162" y2="128" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" stroke-linecap="round"/>
