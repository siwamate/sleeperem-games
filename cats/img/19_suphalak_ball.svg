      <polygon points="150,75 177.3,30.9 135,42" fill="#78350f"/>
      <polygon points="135,42 177.3,30.9 120,55" fill="#b45309"/>
      <polygon points="142,68 164.8,42.599999999999994 126,56" fill="#f472b6" opacity="0.75"/>

