<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
      <linearGradient id="grad-bg-19_suphalak" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
      <filter id="glow-19_suphalak" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="rgba(0,0,0,0.4)"/>
      </filter>
    </defs>
    <rect width="200" height="200" rx="20" fill="url(#grad-bg-19_suphalak)"/>

    <g filter="url(#glow-19_suphalak)">
      <!-- Left Ear Facets -->
      <polygon points="50,75 22.7,30.9 80,55" fill="#451a03"/>
      <polygon points="50,75 22.7,30.9 65,42" fill="#78350f"/>
